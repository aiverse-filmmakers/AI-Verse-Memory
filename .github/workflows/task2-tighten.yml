name: Tighten Task 2 iterator isolation

on:
  push:
    branches: [codex/task-2-memory-workspace-isolation]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/task-2-memory-workspace-isolation
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tighten iterator gate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("scripts/memory.py")
          text = p.read_text(encoding="utf-8")
          old = '''    for path in _iter_atomic_candidates(root, mode):\n        try:\n            infer_scope_from_path(path, root, mode)\n        except (ValueError, OSError):\n            continue\n        yield path\n'''
          new = '''    for path in _iter_atomic_candidates(root, mode):\n        try:\n            infer_scope_from_path(path, root, mode)\n            meta, _ = parse_markdown(path)\n            _validated_atomic_scope(path, root, mode, meta)\n        except (ValueError, OSError):\n            continue\n        yield path\n'''
          if text.count(old) != 1:
              raise SystemExit(f"iterator block count was {text.count(old)}, expected 1")
          p.write_text(text.replace(old, new, 1), encoding="utf-8")

          t = Path("tests/test_memory.py")
          tests = t.read_text(encoding="utf-8")
          marker = '''        self.assertIsNone(mem.index_atomic(path, self.root, mem.MODE_NATIVE))\n        mem.rebuild(silent=True, root=self.root, mode=mem.MODE_NATIVE)\n'''
          replacement = '''        self.assertIsNone(mem.index_atomic(path, self.root, mem.MODE_NATIVE))\n        self.assertNotIn(path, list(mem.iter_atomic_files(self.root, mem.MODE_NATIVE)))\n        mem.rebuild(silent=True, root=self.root, mode=mem.MODE_NATIVE)\n'''
          if tests.count(marker) != 1:
              raise SystemExit(f"test marker count was {tests.count(marker)}, expected 1")
          t.write_text(tests.replace(marker, replacement, 1), encoding="utf-8")
          PY
      - name: Compile and unit tests
        run: |
          python -m py_compile scripts/memory.py
          python -m py_compile scripts/install.py
          python -m unittest discover -s tests -v
      - name: Commit tightening and remove helper workflow
        shell: bash
        run: |
          git config user.name "AI-VERSE Task Automation"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/memory.py tests/test_memory.py
          git rm .github/workflows/task2-tighten.yml
          git commit -m "Tighten Memory atomic iterator scope validation"
          git push origin HEAD:codex/task-2-memory-workspace-isolation
