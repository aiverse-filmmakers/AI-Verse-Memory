name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: |
          python -m py_compile scripts/memory.py
          python -m py_compile scripts/install.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v

  installer-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Shell syntax
        if: runner.os != 'Windows'
        shell: bash
        run: bash -n install.sh

      - name: PowerShell syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path ./install.ps1), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }

      - name: Standalone install twice
        shell: python
        run: |
          import os, pathlib, subprocess, tempfile
          root = pathlib.Path.cwd()
          target = pathlib.Path(tempfile.mkdtemp())
          env = os.environ.copy()
          env["AI_VERSE_MEMORY_TARGET"] = str(target)
          env["AI_VERSE_MEMORY_SOURCE_DIR"] = str(root)
          cmd = [os.sys.executable, str(root / "scripts/install.py"), "--target", str(target), "--source-dir", str(root)]
          subprocess.run(cmd, check=True, env=env)
          subprocess.run(cmd, check=True, env=env)
          assert (target / ".ai-verse-memory/memory.py").exists()
          assert (target / "AGENTS.md").read_text().count("AI-VERSE-MEMORY:START") == 1
          assert (target / "CLAUDE.md").read_text().count("AI-VERSE-MEMORY:START") == 1
          subprocess.run([os.sys.executable, str(target / ".ai-verse-memory/memory.py"), "--root", str(target), "doctor"], check=True)

      - name: AI-Verse OS v2 native install twice
        shell: python
        run: |
          import os, pathlib, shutil, subprocess, tempfile
          root = pathlib.Path.cwd()
          target = pathlib.Path(tempfile.mkdtemp())
          shutil.copytree(root / "tests/fixtures/ai-verse-os-v2", target, dirs_exist_ok=True)
          cmd = [os.sys.executable, str(root / "scripts/install.py"), "--target", str(target), "--source-dir", str(root)]
          subprocess.run(cmd, check=True)
          subprocess.run(cmd, check=True)
          engine = target / "scripts/ai-verse-memory/memory.py"
          assert engine.exists()
          assert not (target / ".ai-verse-memory").exists()
          assert (target / "AGENTS.md").read_text().count("AI-VERSE-MEMORY:START") == 1
          assert "AI-VERSE-MEMORY:START" not in (target / "CLAUDE.md").read_text()
          assert (target / "skills/registry.yaml").read_text().count("id: ai-verse-memory") == 1
          subprocess.run([os.sys.executable, str(engine), "--root", str(target), "remember", "--type", "state", "--workspace", "sample", "--text", "Native installer smoke memory"], check=True)
          recall = subprocess.run([os.sys.executable, str(engine), "--root", str(target), "recall", "smoke memory", "--workspace", "sample"], check=True, text=True, capture_output=True)
          assert "Native installer smoke memory" in recall.stdout
          subprocess.run([os.sys.executable, str(engine), "--root", str(target), "doctor"], check=True)
