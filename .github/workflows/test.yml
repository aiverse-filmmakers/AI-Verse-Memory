name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: |
          python -m py_compile scripts/memory.py
          python -m py_compile scripts/install.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v

  installer-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Shell syntax
        if: runner.os != 'Windows'
        shell: bash
        run: bash -n install.sh

      - name: PowerShell syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path ./install.ps1), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }

      - name: Standalone install twice
        shell: python
        run: |
          import os, pathlib, subprocess, tempfile
          root = pathlib.Path.cwd()
          target = pathlib.Path(tempfile.mkdtemp())
          env = os.environ.copy()
          env["AI_VERSE_MEMORY_TARGET"] = str(target)
          env["AI_VERSE_MEMORY_SOURCE_DIR"] = str(root)
          cmd = [os.sys.executable, str(root / "scripts/install.py"), "--target", str(target), "--source-dir", str(root)]
          subprocess.run(cmd, check=True, env=env)
          subprocess.run(cmd, check=True, env=env)
          assert (target / ".ai-verse-memory/memory.py").exists()
          assert (target / "AGENTS.md").read_text().count("AI-VERSE-MEMORY:START") == 1
          assert (target / "CLAUDE.md").read_text().count("AI-VERSE-MEMORY:START") == 1
          subprocess.run([os.sys.executable, str(target / ".ai-verse-memory/memory.py"), "--root", str(target), "doctor"], check=True)

      - name: AI-Verse OS v2 native install twice leaves tracked OS clean
        shell: python
        run: |
          import json, os, pathlib, shutil, subprocess, tempfile
          root = pathlib.Path.cwd()
          target = pathlib.Path(tempfile.mkdtemp())
          shutil.copytree(root / "tests/fixtures/ai-verse-os-v2", target, dirs_exist_ok=True)

          subprocess.run(["git", "init"], cwd=target, check=True, capture_output=True)
          subprocess.run(["git", "config", "user.email", "ci@example.invalid"], cwd=target, check=True)
          subprocess.run(["git", "config", "user.name", "CI"], cwd=target, check=True)
          subprocess.run(["git", "add", "."], cwd=target, check=True)
          subprocess.run(["git", "commit", "-m", "baseline"], cwd=target, check=True, capture_output=True)

          agents_before = (target / "AGENTS.md").read_text(encoding="utf-8")
          registry_before = (target / "skills/registry.yaml").read_text(encoding="utf-8")
          cmd = [os.sys.executable, str(root / "scripts/install.py"), "--target", str(target), "--source-dir", str(root)]
          subprocess.run(cmd, check=True)
          subprocess.run(cmd, check=True)

          engine = target / "scripts/ai-verse-memory/memory.py"
          assert engine.exists()
          assert not (target / ".ai-verse-memory").exists()
          assert (target / "AGENTS.md").read_text(encoding="utf-8") == agents_before
          assert (target / "skills/registry.yaml").read_text(encoding="utf-8") == registry_before
          assert "AI-VERSE-MEMORY:START" not in (target / "CLAUDE.md").read_text(encoding="utf-8")

          local_registry = json.loads((target / ".aiverse/extensions/registry.json").read_text(encoding="utf-8"))
          memory = local_registry["extensions"]["ai-verse-memory"]
          assert memory["supported"] is True
          assert memory["installed"] is True
          assert memory["enabled"] is True
          assert memory["engine"] == "scripts/ai-verse-memory/memory.py"

          tracked = subprocess.run(
              ["git", "status", "--porcelain", "--untracked-files=no"],
              cwd=target,
              check=True,
              text=True,
              capture_output=True,
          ).stdout.strip()
          assert tracked == "", tracked

          subprocess.run([os.sys.executable, str(engine), "--root", str(target), "remember", "--type", "state", "--workspace", "sample", "--text", "Native installer smoke memory"], check=True)
          recall = subprocess.run([os.sys.executable, str(engine), "--root", str(target), "recall", "smoke memory", "--workspace", "sample"], check=True, text=True, capture_output=True)
          assert "Native installer smoke memory" in recall.stdout
          subprocess.run([os.sys.executable, str(engine), "--root", str(target), "doctor"], check=True)

      - name: Legacy Memory integration migrates back to clean tracked OS
        shell: python
        run: |
          import importlib.util, os, pathlib, shutil, subprocess, tempfile
          root = pathlib.Path.cwd()
          spec = importlib.util.spec_from_file_location("installer_acceptance", root / "scripts/install.py")
          installer = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(installer)

          target = pathlib.Path(tempfile.mkdtemp())
          shutil.copytree(root / "tests/fixtures/ai-verse-os-v2", target, dirs_exist_ok=True)
          subprocess.run(["git", "init"], cwd=target, check=True, capture_output=True)
          subprocess.run(["git", "config", "user.email", "ci@example.invalid"], cwd=target, check=True)
          subprocess.run(["git", "config", "user.name", "CI"], cwd=target, check=True)
          subprocess.run(["git", "add", "."], cwd=target, check=True)
          subprocess.run(["git", "commit", "-m", "baseline"], cwd=target, check=True, capture_output=True)

          installer.replace_marker_block(target / "AGENTS.md", installer.NATIVE_BLOCK)
          registry = target / "skills/registry.yaml"
          text = registry.read_text(encoding="utf-8")
          text = text.replace("promotion_rule:", installer.LEGACY_REGISTRY_BLOCK + "\npromotion_rule:", 1)
          registry.write_text(text, encoding="utf-8")

          dirty_before = subprocess.run(
              ["git", "status", "--porcelain", "--untracked-files=no"],
              cwd=target,
              check=True,
              text=True,
              capture_output=True,
          ).stdout.strip()
          assert dirty_before, "legacy integration should dirty tracked OS files"

          cmd = [os.sys.executable, str(root / "scripts/install.py"), "--target", str(target), "--source-dir", str(root)]
          subprocess.run(cmd, check=True)

          tracked_after = subprocess.run(
              ["git", "status", "--porcelain", "--untracked-files=no"],
              cwd=target,
              check=True,
              text=True,
              capture_output=True,
          ).stdout.strip()
          assert tracked_after == "", tracked_after
          assert (target / ".aiverse/extensions/registry.json").exists()

  os-update-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Current OS then Memory then OS update
        shell: bash
        run: |
          set -euo pipefail
          MEMORY_ROOT="$PWD"
          TARGET="$RUNNER_TEMP/ai-verse-os-current"
          rm -rf "$TARGET"
          git clone --depth 1 https://github.com/aiverse-filmmakers/AI-Verse-OS.git "$TARGET"

          python "$MEMORY_ROOT/scripts/install.py" --target "$TARGET" --source-dir "$MEMORY_ROOT"

          test -z "$(git -C "$TARGET" status --porcelain --untracked-files=no)"
          test -f "$TARGET/.aiverse/extensions/registry.json"
          git -C "$TARGET" check-ignore -q .aiverse/extensions/registry.json

          node "$TARGET/bin/ai-verse-os.mjs" update --dir "$TARGET"

          test -z "$(git -C "$TARGET" status --porcelain --untracked-files=no)"
          test -f "$TARGET/.aiverse/extensions/registry.json"
          grep -Fq '.aiverse/extensions/registry.json' "$TARGET/AGENTS.md"
          test -f "$TARGET/scripts/ai-verse-memory/memory.py"

      - name: Memory on pre-registry OS then OS update forward
        shell: bash
        run: |
          set -euo pipefail
          MEMORY_ROOT="$PWD"
          TARGET="$RUNNER_TEMP/ai-verse-os-pre-registry"
          rm -rf "$TARGET"
          git clone https://github.com/aiverse-filmmakers/AI-Verse-OS.git "$TARGET"
          git -C "$TARGET" checkout -b pre-registry a7849c01b71b184c4c8f452e6d07dd240c1d4c3e

          python "$MEMORY_ROOT/scripts/install.py" --target "$TARGET" --source-dir "$MEMORY_ROOT"

          test -z "$(git -C "$TARGET" status --porcelain --untracked-files=no)"
          test -f "$TARGET/.aiverse/extensions/registry.json"
          ! grep -Fq '.aiverse/extensions/registry.json' "$TARGET/AGENTS.md"

          node "$TARGET/bin/ai-verse-os.mjs" update --dir "$TARGET"

          test -z "$(git -C "$TARGET" status --porcelain --untracked-files=no)"
          test -f "$TARGET/.aiverse/extensions/registry.json"
          git -C "$TARGET" check-ignore -q .aiverse/extensions/registry.json
          grep -Fq '.aiverse/extensions/registry.json' "$TARGET/AGENTS.md"
          test -f "$TARGET/scripts/ai-verse-memory/memory.py"
